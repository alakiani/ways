# The alert table of ADR 0006. Generated by internal/monitoring; do not edit.
groups:
  - name: ways
    rules:
      - alert: NodeUnreachable
        expr: "max_over_time(up{job=\"agents\"}[3m]) == 0 and on (node) ways_node_report_age_seconds > 180"
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node }} is unreachable: no scrape and no health report"
      - alert: CoordinatorUnreachableFromNode
        expr: "ways_coordinator_last_contact_seconds > 180"
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} has not reached the Coordinator for {{ $value | humanizeDuration }}"
      - alert: LinkDown
        expr: "max by (link) (ways_link_up) == 0"
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Link {{ $labels.link }} has no working transport"
      - alert: LinkBlackout
        expr: "changes((max by (link) (ways_link_instance_up) == bool 0)[1h:]) >= 5"
        labels:
          severity: warning
        annotations:
          summary: "Every instance of Link {{ $labels.link }} went down at once at least 3 times in an hour"
      - alert: BridgeHasNoDefaultPath
        expr: "ways_path_ok{default=\"true\"} == 0"
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Bridge {{ $labels.node }} has no Path for the default Rule"
      - alert: PathFlapping
        expr: "increase(ways_path_moves_total{kind=\"failure\"}[1h]) > 6"
        labels:
          severity: warning
        annotations:
          summary: "Paths of Rule {{ $labels.rule }} on {{ $labels.node }} flap: {{ $value | printf \"%.0f\" }} failure moves in an hour"
      - alert: BridgeRemovedFromBridgeAddress
        expr: "ways_bridge_address_member == 0"
        labels:
          severity: warning
        annotations:
          summary: "Bridge {{ $labels.node }} is out of the Bridge Address"
      - alert: BridgeReturnedToBridgeAddress
        expr: "increase(ways_bridge_address_joins_total[10m]) > 0"
        labels:
          severity: info
        annotations:
          summary: "A Bridge joined the Bridge Address"
      - alert: BridgeAddressDownToOneBridge
        expr: "ways_bridge_address_members == 1"
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The Bridge Address holds only one Bridge"
      - alert: ArvanCloudDNSFailing
        expr: "ways_arvan_consecutive_failures >= 3"
        labels:
          severity: warning
        annotations:
          summary: "ArvanCloud's DNS API failed {{ $value }} times in a row"
      - alert: ProbeFailing
        expr: "ways_probe_ok == 0"
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The probe Device fails on Bridge {{ $labels.node }}"
      - alert: CertificateOrTokenExpiring
        expr: "ways_client_cert_expiry_timestamp_seconds - time() < 2592000"
        labels:
          severity: warning
        annotations:
          summary: "The client certificate of Node {{ $labels.node }} expires in {{ $value | humanizeDuration }}"
      - alert: CertificateOrTokenExpiring
        expr: "ways_public_tls_expiry_timestamp_seconds - time() < 1209600"
        labels:
          severity: warning
        annotations:
          summary: "The public TLS certificate expires in {{ $value | humanizeDuration }}"
      - alert: CertificateOrTokenExpiring
        expr: "ways_api_token_expiry_timestamp_seconds - time() < 604800"
        labels:
          severity: warning
        annotations:
          summary: "API token {{ $labels.token }} expires in {{ $value | humanizeDuration }}"
      - alert: ClockSkew
        expr: "abs(ways_node_clock_skew_seconds) > 60"
        labels:
          severity: warning
        annotations:
          summary: "The clock of Node {{ $labels.node }} is {{ $value | humanizeDuration }} off"
      - alert: CIDRRefresh
        expr: "ways_irfeed_last_rejected == 1 or time() - ways_irfeed_last_success_timestamp_seconds > 259200"
        labels:
          severity: warning
        annotations:
          summary: "The feed of Destination Set {{ $labels.set }} was rejected or is over 3 days old"
      - alert: BackupStale
        expr: "time() - ways_backup_last_success_timestamp_seconds > 129600"
        labels:
          severity: warning
        annotations:
          summary: "The last good backup is {{ $value | humanizeDuration }} old"
      - alert: MeteringBacklog
        expr: "ways_metering_backlog_seconds > 10800"
        labels:
          severity: warning
        annotations:
          summary: "Bridge {{ $labels.node }} has {{ $value | humanizeDuration }} of metering not acknowledged"
      - alert: MeteringMismatch
        expr: "abs(increase(ways_metered_bytes_total[1d]) - increase(ways_bridge_interface_bytes_total[1d])) > 0.2 * increase(ways_bridge_interface_bytes_total[1d]) and increase(ways_bridge_interface_bytes_total[1d]) > 1e8"
        labels:
          severity: warning
        annotations:
          summary: "Metered bytes on Bridge {{ $labels.node }} differ from its interface bytes by over 20% in a day"
      - alert: SnapshotApplyFailed
        expr: "increase(ways_snapshot_apply_failures_total[10m]) > 0"
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.node }} reverted a snapshot that cut it off from the Coordinator"
      - alert: DiskFull
        expr: "1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"} > 0.85"
        labels:
          severity: warning
        annotations:
          summary: "The disk of {{ $labels.node }} is {{ $value | humanizePercentage }} full"
      - alert: ConntrackFull
        expr: "node_nf_conntrack_entries / node_nf_conntrack_entries_limit > 0.8"
        labels:
          severity: warning
        annotations:
          summary: "The conntrack table of {{ $labels.node }} is {{ $value | humanizePercentage }} full"
