# enroll.yml enrolls Nodes (ADR 0002), or upgrades the Agent on Nodes that
# already enrolled. Roles and Tags come from the inventory group (domestic or
# abroad); the Node's name is its inventory name.
#
#   scripts/ways-ansible enroll.yml              every Node
#   scripts/ways-ansible enroll.yml -l ir-1      one Node
#   scripts/ways-ansible enroll.yml -l ir-1 -e reenroll=true   re-key it
- name: Nodes
  hosts: all:!coordinators
  become: true
  vars:
    reenroll: false
    ways_api_token: "{{ lookup('file', ways_home ~ '/enroll-token') }}"
    ways_api_headers:
      Authorization: "Bearer {{ ways_api_token }}"
  pre_tasks:
    - name: Check the laptop has the release, the pinned CA and the token
      ansible.builtin.assert:
        that:
          - ways_release | length > 0
          - ways_roles is defined
          - (ways_home ~ '/ca.crt') is file
          - (ways_home ~ '/enroll-token') is file
        fail_msg: >-
          Set WAYS_RELEASE, put the Node in the domestic or abroad group, and
          run coordinator.yml first: it brings back ca.crt and enroll-token.
      delegate_to: localhost
      become: false

    - name: Check the release against its SHA256SUMS
      ansible.builtin.include_tasks: tasks/verify-release.yml

  tasks:
    - name: Install Ubuntu's packages
      ansible.builtin.apt:
        name: "{{ ['nftables', 'prometheus-node-exporter', 'wireguard-tools'] + (['chrony'] if ways_chrony else []) }}"
        update_cache: true
        cache_valid_time: 3600

    - name: Keep node_exporter on loopback; the Agent serves it through /metrics
      ansible.builtin.template:
        src: node-exporter.default.j2
        dest: /etc/default/prometheus-node-exporter
        mode: "0644"
      register: node_exporter_args

    - name: Start node_exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: "{{ 'restarted' if node_exporter_args.changed else 'started' }}"

    # systemd-networkd's defaults delete routing-policy rules and routes it
    # did not make whenever it restarts, as an unattended systemd upgrade
    # does. That once left a Bridge without the Agent's ip rules, sending
    # its traffic for abroad out of its own uplink.
    - name: Make the networkd config directory
      ansible.builtin.file:
        path: /etc/systemd/networkd.conf.d
        state: directory
        mode: "0755"

    - name: Keep systemd-networkd off the Agent's rules, routes and interfaces
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - dest: /etc/systemd/networkd.conf.d/ways.conf
          content: |
            # Managed by enroll.yml: leave the Agent's ip rules and routes alone.
            [Network]
            ManageForeignRoutingPolicyRules=no
            ManageForeignRoutes=no
        - dest: /etc/systemd/network/00-ways-unmanaged.network
          content: |
            # Managed by enroll.yml: the Agent's Link and Device interfaces
            # (dz*: Link interfaces named before the rename, removed by the Agent).
            [Match]
            Name=ways* dz*

            [Link]
            Unmanaged=yes
      loop_control:
        label: "{{ item.dest }}"
      register: networkd_config

    - name: Restart systemd-networkd with those settings, if it runs
      ansible.builtin.shell: >-
        if systemctl is-active --quiet systemd-networkd;
        then systemctl restart systemd-networkd; fi
      when: networkd_config.changed

    - name: Create the directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/ways, mode: "0755" }
        - { path: /usr/local/lib/ways, mode: "0755" }
        - { path: /var/lib/ways-agent, mode: "0700" }

    - name: Install the Agent and the pinned amneziawg-go
      ansible.builtin.copy:
        src: "{{ ways_release_dir }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0755"
      loop:
        - { src: ways-agent, dest: /usr/local/bin/ways-agent }
        - { src: amneziawg-go, dest: /usr/local/lib/ways/amneziawg-go }
      register: binaries

    - name: Pin the Coordinator's CA
      ansible.builtin.copy:
        src: "{{ ways_home }}/ca.crt"
        dest: /etc/ways/ca.crt
        mode: "0644"
      register: ca

    - name: Install the units
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: ways-agent.service.j2, dest: ways-agent.service }
        - { src: "{{ playbook_dir }}/../systemd/ways-awg@.service", dest: "ways-awg@.service" }
      register: units

    # Idempotent: an enrolled Node gets no token unless reenroll is set. A
    # Node that exists with other Tags is refused (409); other Roles are
    # taken (ADR 0014).
    - name: Create the Node, or get a fresh enrollment token for it
      ansible.builtin.uri:
        url: "{{ ways_api_url }}/v1/nodes"
        method: POST
        headers: "{{ ways_api_headers }}"
        body_format: json
        body:
          name: "{{ inventory_hostname }}"
          roles: "{{ ways_roles }}"
          tags: "{{ ways_tags }}"
          reenroll: "{{ reenroll | bool }}"
        ca_path: "{{ ways_api_ca_path or omit }}"
      delegate_to: localhost
      become: false
      register: node
      changed_when: node.json.enrollment_token is defined
      no_log: true

    - name: Forget the old identity, to re-key
      ansible.builtin.file:
        path: "/var/lib/ways-agent/{{ item }}"
        state: absent
      loop: [agent.key, agent.crt]
      when: reenroll | bool

    # The Agent uses the token only until it holds a certificate; an empty
    # file afterwards keeps the unit unchanged.
    - name: Hand the Agent its one-time enrollment token
      ansible.builtin.copy:
        content: "{{ node.json.enrollment_token | default('') }}\n"
        dest: /etc/ways/enroll-token
        mode: "0600"
      when: node.json.enrollment_token is defined
      no_log: true
      register: token

    - name: Make sure the token file exists
      ansible.builtin.copy:
        content: "\n"
        dest: /etc/ways/enroll-token
        mode: "0600"
        force: false

    - name: Start the Agent, restarting it if anything changed
      ansible.builtin.systemd_service:
        name: ways-agent
        enabled: true
        daemon_reload: "{{ units.changed }}"
        state: "{{ 'restarted' if (binaries.changed or ca.changed or units.changed or token.changed) else 'started' }}"

    - name: Wait for its first health report from this release
      ansible.builtin.uri:
        url: "{{ ways_api_url }}/v1/nodes/{{ node.json.node.id }}"
        headers: "{{ ways_api_headers }}"
        ca_path: "{{ ways_api_ca_path or omit }}"
      delegate_to: localhost
      become: false
      register: status
      until: >-
        status.json.enrolled
        and status.json.last_health is defined
        and status.json.last_health.agent_version == ways_release
      retries: 60
      delay: 5
      no_log: true

    - name: Empty the used enrollment token
      ansible.builtin.copy:
        content: "\n"
        dest: /etc/ways/enroll-token
        mode: "0600"
      when: token.changed
      no_log: true

    # The wizard's small UDP probe can pass where the filter still drops tunnel
    # traffic, so check the Links themselves. A Link to a Node not enrolled
    # yet is down too, so this warns rather than fails.
    - name: Wait for this Node's Links to come up
      ansible.builtin.uri:
        url: "{{ ways_api_url }}/v1/nodes/{{ node.json.node.id }}"
        headers: "{{ ways_api_headers }}"
        ca_path: "{{ ways_api_ca_path or omit }}"
      delegate_to: localhost
      become: false
      register: link_status
      until: >-
        link_status.json is defined
        and (link_status.json.last_health.links | default([]) | length) > 0
        and (link_status.json.last_health.links | rejectattr('up') | list | length) == 0
      retries: 24
      delay: 5
      failed_when: false
      no_log: true

    - name: Warn about Links still down
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ down | length }} of {{ links | length }} Links on {{ inventory_hostname }}
          are down (Link {{ down | map(attribute='link_id') | join(', ') }}).
          If they stay down, the filter is probably dropping tunnel traffic to the
          other end; the admin panel's Links page names it.
      vars:
        links: "{{ ((link_status.json | default({})).last_health | default({})).links | default([]) }}"
        down: "{{ links | rejectattr('up') | list }}"
      when: links | length == 0 or down | length > 0

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ status.json.id }}) runs {{ ways_release }} as
          {{ ways_roles | join('+') }}{{ ' tagged ' ~ (ways_tags | join(',')) if ways_tags else '' }},
          seen from {{ status.json.last_health.seen_addr }}
